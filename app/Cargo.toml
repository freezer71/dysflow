[package]
name = "dysflow-app"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "Lecteur Dysflow en interface graphique (GPUI)"
license = "MIT"

[lib]
name = "dysflow_app"
path = "src/lib.rs"

[[bin]]
name = "dysflow-app"
path = "src/main.rs"

[dependencies]
dysflow = { path = "..", default-features = false, features = ["clipboard"] }
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
# Les plateformes réelles (Metal, Windows, Wayland/X11) : gpui-pre n'embarque que la plateforme de test.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "x11"] }

[dev-dependencies]
# La plateforme de test de GPUI (TestAppContext), sans fenêtre réelle.
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }

[features]
# Les tests construisent sans moteur ; les paquets choisissent leurs features.
default = []
mlx = ["dysflow/mlx"]
onnx = ["dysflow/kokoro-onnx"]
ocr = ["dysflow/ocr"]
