[package]
name = "dysflow-app"
version = "0.6.1"
edition = "2021"
rust-version = "1.100"
description = "Lecteur Dysflow en interface graphique (GPUI)"
license = "MIT"

[lib]
name = "dysflow_app"
path = "src/lib.rs"

[[bin]]
name = "dysflow-app"
path = "src/main.rs"

[dependencies]
dysflow = { path = "..", default-features = false, features = ["clipboard"] }
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
# Les icônes Lucide de gpui-component (lecture, pause, phrase précédente…).
gpui-kit-assets = "=0.11.0"
# Les plateformes réelles (Metal, Windows, Wayland/X11) : gpui-pre n'embarque que la plateforme de test.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "x11"] }
# La langue du système quand l'environnement n'en donne pas (app lancée du
# Finder, Windows) : déjà dans Cargo.lock par gpui.
sys-locale = "=0.3.2"

# La boîte du système quand la fenêtre ne s'ouvre pas (`startup::system_alert`) :
# l'app Windows n'a pas de console. Déjà dans Cargo.lock (clap, arboard…).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Les erreurs des téléchargements factices des essais (`set_download_start`).
anyhow = "1.0"
# La plateforme de test de GPUI (TestAppContext), sans fenêtre réelle.
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
# Les essais ne touchent jamais aux fichiers de l'utilisateur (positions,
# réglages, cache) : les répertoires du lecteur sont ceux des essais.
dysflow = { path = "..", default-features = false, features = ["clipboard", "test-paths"] }

[features]
# Les tests construisent sans moteur ; les paquets choisissent leurs features.
default = []
mlx = ["dysflow/mlx"]
onnx = ["dysflow/kokoro-onnx"]
ocr = ["dysflow/ocr"]
