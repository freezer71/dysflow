[package]
name = "dysflow-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Liaison UniFFI du lecteur dysflow pour l'app macOS"

[lib]
name = "dysflow_ffi"
# staticlib pour l'app, cdylib pour que uniffi-bindgen (ffi/bindgen) lise les
# métadonnées.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
dysflow = { path = "..", default-features = false, features = ["clipboard"] }
uniffi = "0.32"
thiserror = "2"
anyhow = "1.0"

[features]
ocr = ["dysflow/ocr"]
# MLX en Rust (mlx-rs ; Mac Apple Silicon seulement, sans effet ailleurs) et
# `mlx_rust_smoke`. Hors de l'app livrée jusqu'au lot 3 : seul le build de
# test de la CI l'active (FEATURES=ocr,mlx ./scripts/build-ffi.sh), pour le
# test de cohabitation des deux copies de MLX (décision « Lot 0 »).
mlx = ["dysflow/mlx"]
