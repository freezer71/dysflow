[package]
name = "dysflow-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Liaison UniFFI du lecteur dysflow pour l'app macOS"

[lib]
name = "dysflow_ffi"
# staticlib pour l'app, cdylib pour que uniffi-bindgen (ffi/bindgen) lise les
# métadonnées.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# mlx : MLX en Rust (Mac Apple Silicon seulement, sans effet ailleurs).
dysflow = { path = "..", default-features = false, features = ["clipboard", "mlx"] }
uniffi = "0.32"
thiserror = "2"
anyhow = "1.0"

[features]
ocr = ["dysflow/ocr"]
