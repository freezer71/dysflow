name: Sillage
options:
  bundleIdPrefix: fr.sillage
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  # MLX : lié une seule fois, dans le framework KokoroMLX.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
configFiles:
  Debug: Generated/Link.xcconfig
  Release: Generated/Link.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Toutes les vérifications de concurrence de Swift 6, en avertissements.
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # CFBundleShortVersionString et CFBundleVersion (clé de la préparation
    # des noyaux Metal, une fois par version) : à monter à chaque version.
    MARKETING_VERSION: 0.3.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    # Link.xcconfig s'applique à toutes les cibles, tests compris.
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Libraries
targets:
  # Kokoro en MLX : fichiers de mlx-audio-swift (MIT) et la porte KokoroRunner.
  # La seule cible liée à MLX : une copie, un cache, un plafond mémoire.
  KokoroMLX:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/KokoroMLX
        # La licence part dans Contents/Resources/licences (script de Sillage).
        excludes: [ORIGINE.md, LICENSE]
      # La voix française fixe de Qwen3 0.6B (Tâche 3 du lot 3).
      - path: ../assets/voices/qwen3-06b-siwis.safetensors
        buildPhase: resources
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
      - package: MLXSwift
        product: MLXFFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sillage.kokoromlx
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # Link.xcconfig lie le moteur Rust : rien à faire ici.
        OTHER_LDFLAGS: ""
  Sillage:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated/sillage_ffi.swift
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # L'icône de l'app (scripts/logo.sh l'écrit depuis assets/logo).
      - path: Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
      # MLX n'arrive que par ce framework (jamais en paquet ici).
      - target: KokoroMLX
        embed: true
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sillage.app
        PRODUCT_NAME: Sillage
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: sillage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # La dictée : le micro, transcrit sur le Mac (SpeechAnalyzer).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "sillage écoute le micro pendant la dictée, pour écrire ce que vous dites. Rien ne quitte votre Mac."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "sillage transcrit votre voix sur votre Mac pendant la dictée."
        # `scripts/build-macos.sh --mesure` y met SILLAGE_MESURE : le code de
        # mesure (`--measure`) n'entre que dans cette copie, jamais dans
        # l'app livrée. DEBUG (tests) l'a aussi.
        SILLAGE_CONDITIONS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(SILLAGE_CONDITIONS)
    preBuildScripts:
      - name: Vérifier que le moteur Rust est à jour
        basedOnDependencyAnalysis: false
        script: |
          # Xcode lie macos/Libraries/libsillage_ffi.a telle quelle : une
          # bibliothèque plus ancienne que les sources Rust donnerait une app
          # qui ne fait pas ce que dit le code (ou une liaison qui ne
          # correspond plus à Generated/sillage_ffi.swift).
          ROOT="$SRCROOT/.."
          LIB="$SRCROOT/Libraries/libsillage_ffi.a"
          if [ ! -f "$LIB" ]; then
            echo "error: moteur Rust absent ($LIB) : lancer ./scripts/build-ffi.sh"
            exit 1
          fi
          NEWER=$(find "$ROOT/src" "$ROOT/ffi/src" "$ROOT/Cargo.toml" "$ROOT/Cargo.lock" \
                       "$ROOT/ffi/Cargo.toml" -type f -newer "$LIB" 2>/dev/null | head -5)
          if [ -n "$NEWER" ]; then
            echo "error: moteur Rust périmé : des sources sont plus récentes que libsillage_ffi.a — lancer ./scripts/build-ffi.sh"
            echo "$NEWER" | sed 's/^/note: plus récent : /'
            exit 1
          fi
    postBuildScripts:
      - name: Joindre sillage-espeak (GPL-3.0, programme séparé)
        basedOnDependencyAnalysis: false
        script: |
          ESPEAK="$SRCROOT/../target/espeak"
          if [ -x "$ESPEAK/bin/sillage-espeak" ]; then
            HELPERS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            mkdir -p "$HELPERS" "$RES/espeak-ng"
            cp "$ESPEAK/bin/sillage-espeak" "$HELPERS/"
            rm -rf "$RES/espeak-ng-data"
            cp -R "$ESPEAK/share/espeak-ng-data" "$RES/"
            # La GPL : licence, adresse des sources et sources de sillage-espeak.
            cp "$ESPEAK/COPYING" "$ESPEAK/SOURCE.txt" "$ESPEAK/sillage-espeak.c" \
               "$SRCROOT/../scripts/build-espeak.sh" "$RES/espeak-ng/"
            codesign --force --sign - "$HELPERS/sillage-espeak"
          else
            echo "warning: sillage-espeak absent (./scripts/build-espeak.sh) : Kokoro se repliera"
          fi
      - name: Joindre NOTICE et les licences des bibliothèques
        basedOnDependencyAnalysis: false
        script: |
          # Une licence manquante arrête la construction : l'app ne part
          # jamais sans le texte des licences de ce qu'elle contient.
          L="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licences"
          CHECKOUTS="$BUILD_DIR/../../SourcePackages/checkouts"
          CMLX="$CHECKOUTS/mlx-swift/Source/Cmlx"
          mkdir -p "$L"
          joindre() {
            if [ ! -f "$1" ]; then
              echo "error: licence introuvable : $1"
              exit 1
            fi
            # install -m 644 : les fichiers des paquets sont en lecture seule.
            install -m 644 "$1" "$L/$2"
          }
          joindre "$SRCROOT/../NOTICE" NOTICE
          joindre "$SRCROOT/../third_party/sonic/LICENSE" sonic-LICENSE
          joindre "$SRCROOT/Vendor/KokoroMLX/LICENSE" mlx-audio-swift-LICENSE
          # STT/BaseConfiguration.swift et TTS/KVCache.swift (Vendor/KokoroMLX)
          # viennent de mlx-swift-lm.
          joindre "$SRCROOT/../third_party/licences/mlx-swift-lm-LICENSE" mlx-swift-lm-LICENSE
          # MagpieTTS (Vendor/KokoroMLX/TTS/Magpie) vient de speech-swift.
          joindre "$SRCROOT/../third_party/licences/speech-swift-LICENSE" speech-swift-LICENSE
          joindre "$SRCROOT/../third_party/licences/cmudict-LICENSE" cmudict-LICENSE
          joindre "$CHECKOUTS/mlx-swift/LICENSE" mlx-swift-LICENSE
          joindre "$CMLX/mlx/LICENSE" mlx-LICENSE
          joindre "$CMLX/mlx-c/LICENSE" mlx-c-LICENSE
          joindre "$CMLX/metal-cpp/LICENSE.txt" metal-cpp-LICENSE
          joindre "$CMLX/json/LICENSE.MIT" nlohmann-json-LICENSE
          joindre "$CMLX/fmt/LICENSE" fmt-LICENSE
          joindre "$CHECKOUTS/KeyboardShortcuts/license" KeyboardShortcuts-LICENSE
          # Le moteur Rust (libsillage_ffi.a) : ses crates, et Tesseract et
          # Leptonica que la crate tesseract-rs compile dedans (feature ocr).
          joindre "$SRCROOT/../THIRD-PARTY-RUST.txt" THIRD-PARTY-RUST.txt
          joindre "$SRCROOT/../third_party/licences/tesseract-LICENSE" tesseract-LICENSE
          joindre "$SRCROOT/../third_party/licences/leptonica-LICENSE" leptonica-LICENSE
  SillageTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Sillage
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sillage.app/Contents/MacOS/Sillage
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  SillageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Sillage
    settings:
      base:
        TEST_TARGET_NAME: Sillage
        # Le test d'interface pilote l'app de l'extérieur : aucune liaison au moteur.
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sillage:
    build:
      targets:
        Sillage: all
    test:
      targets: [SillageTests, SillageUITests]
