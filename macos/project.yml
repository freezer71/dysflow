name: Sillon
options:
  bundleIdPrefix: fr.sillon
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  # MLX : lié une seule fois, dans le framework KokoroMLX.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
configFiles:
  Debug: Generated/Link.xcconfig
  Release: Generated/Link.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # CFBundleShortVersionString et CFBundleVersion (clé de la préparation
    # des noyaux Metal, une fois par version) : à monter à chaque version.
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    # Link.xcconfig s'applique à toutes les cibles, tests compris.
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Libraries
targets:
  # Kokoro en MLX : fichiers de mlx-audio-swift (MIT) et la porte KokoroRunner.
  # La seule cible liée à MLX : une copie, un cache, un plafond mémoire.
  KokoroMLX:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/KokoroMLX
        # La licence part dans Contents/Resources/licences (script de Sillon).
        excludes: [ORIGINE.md, LICENSE]
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
      - package: MLXSwift
        product: MLXFFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sillon.kokoromlx
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # Link.xcconfig lie le moteur Rust : rien à faire ici.
        OTHER_LDFLAGS: ""
  Sillon:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated/sillon_ffi.swift
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      # MLX n'arrive que par ce framework (jamais en paquet ici).
      - target: KokoroMLX
        embed: true
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sillon.app
        PRODUCT_NAME: Sillon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: sillon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    postBuildScripts:
      - name: Joindre le shim audio.cpp
        basedOnDependencyAnalysis: false
        script: |
          SHIM="$SRCROOT/Libraries/libaudiocpp_shim.dylib"
          if [ -f "$SHIM" ]; then
            DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            mkdir -p "$DEST"
            cp "$SHIM" "$DEST/"
            codesign --force --sign - "$DEST/libaudiocpp_shim.dylib"
          fi
      - name: Joindre sillon-espeak (GPL-3.0, programme séparé)
        basedOnDependencyAnalysis: false
        script: |
          ESPEAK="$SRCROOT/../target/espeak"
          if [ -x "$ESPEAK/bin/sillon-espeak" ]; then
            HELPERS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            mkdir -p "$HELPERS" "$RES/espeak-ng"
            cp "$ESPEAK/bin/sillon-espeak" "$HELPERS/"
            rm -rf "$RES/espeak-ng-data"
            cp -R "$ESPEAK/share/espeak-ng-data" "$RES/"
            # La GPL : licence, adresse des sources et sources de sillon-espeak.
            cp "$ESPEAK/COPYING" "$ESPEAK/SOURCE.txt" "$ESPEAK/sillon-espeak.c" \
               "$SRCROOT/../scripts/build-espeak.sh" "$RES/espeak-ng/"
            codesign --force --sign - "$HELPERS/sillon-espeak"
          else
            echo "warning: sillon-espeak absent (./scripts/build-espeak.sh) : Kokoro se repliera"
          fi
      - name: Joindre NOTICE et les licences des bibliothèques
        basedOnDependencyAnalysis: false
        script: |
          # Une licence manquante arrête la construction : l'app ne part
          # jamais sans le texte des licences de ce qu'elle contient.
          L="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licences"
          CHECKOUTS="$BUILD_DIR/../../SourcePackages/checkouts"
          CMLX="$CHECKOUTS/mlx-swift/Source/Cmlx"
          mkdir -p "$L"
          joindre() {
            if [ ! -f "$1" ]; then
              echo "error: licence introuvable : $1"
              exit 1
            fi
            # install -m 644 : les fichiers des paquets sont en lecture seule.
            install -m 644 "$1" "$L/$2"
          }
          joindre "$SRCROOT/../NOTICE" NOTICE
          joindre "$SRCROOT/../third_party/sonic/LICENSE" sonic-LICENSE
          joindre "$SRCROOT/Vendor/KokoroMLX/LICENSE" mlx-audio-swift-LICENSE
          joindre "$CHECKOUTS/mlx-swift/LICENSE" mlx-swift-LICENSE
          joindre "$CMLX/mlx/LICENSE" mlx-LICENSE
          joindre "$CMLX/mlx-c/LICENSE" mlx-c-LICENSE
          joindre "$CMLX/metal-cpp/LICENSE.txt" metal-cpp-LICENSE
          joindre "$CMLX/json/LICENSE.MIT" nlohmann-json-LICENSE
          joindre "$CMLX/fmt/LICENSE" fmt-LICENSE
          joindre "$CHECKOUTS/KeyboardShortcuts/license" KeyboardShortcuts-LICENSE
  SillonTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Sillon
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sillon.app/Contents/MacOS/Sillon
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  SillonUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Sillon
    settings:
      base:
        TEST_TARGET_NAME: Sillon
        # Le test d'interface pilote l'app de l'extérieur : aucune liaison au moteur.
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sillon:
    build:
      targets:
        Sillon: all
    test:
      targets: [SillonTests, SillonUITests]
