# Intégration continue : tests et lint Rust sur les plateformes visées
# (Linux x86_64 et ARM64, macOS Apple Silicon, Windows x86_64), paquet du
# terminal sous Linux et Windows, MSRV, licences, scripts, et tests de l'app
# macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 : l'image macos-14 est retirée le 2 novembre 2026
        # (actions/runner-images#13518).
        # windows-2025 : le cœur et le terminal se compilent et se testent
        # sous Windows, et le paquet Windows y est construit (lot W).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        # ALSA pour rodio/cpal ; cmake et clang pour Tesseract (feature ocr)
        # et espeak-ng (build-espeak.sh).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake clang
      - name: Chaîne Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Metal Toolchain et cible explicite (MLX de mlx-rs)
        # Sur Mac, Tests et Clippy activent la feature mlx de ffi/ (hors de
        # l'app livrée jusqu'au lot 3) : MLX compilé par CMake, dont les
        # noyaux demandent le compilateur Metal.
        # La cible explicite sépare toujours les dépendances de build de
        # celles du code : Tests et Clippy voient alors le même mlx-sys et
        # partagent un seul build de MLX. Sans elle, cargo partage ces
        # dépendances avec le code en test mais pas en clippy (qui ne les
        # compile qu'en métadonnées), et MLX se recompile (~8 min).
        # DYSFLOW_MLX_CACHE : la clé du cache de target/ (voir la garde de
        # scripts/mlx-sources.sh). Elle suit ce que la garde vérifie (ses deux
        # scripts, et le macOS de l'hôte, cible des noyaux) et Xcode, dont
        # mlx-sys suit les en-têtes : sinon, un cache qu'elle refuse serait
        # repris tel quel à chaque exécution, et MLX recompilé chaque fois.
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "CARGO_BUILD_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "DYSFLOW_MLX_CACHE=mlx-$({ cat scripts/mlx-sources.sh scripts/mlx-sources.cmake; sw_vers -productVersion | cut -d. -f1,2; xcodebuild -version; } | shasum -a 256 | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # Vide hors de Mac : clé inchangée sous Linux et Windows.
          key: ${{ env.DYSFLOW_MLX_CACHE }}
      - name: Sources épinglées de MLX, en cache (Mac)
        # Après rust-cache : son post, qui vide target/mlx-sources, passe
        # après celui-ci, qui sauve.
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mlx-sources
          key: mlx-sources-${{ hashFiles('scripts/mlx-sources.sh') }}
      - name: Sources épinglées de MLX (Mac)
        # rust-cache vide target/mlx-metallib avant de sauver, mais chaque
        # build de mlx-sys garde ses noyaux (out/build/lib). La copie la plus
        # récente est celle d'avant la sauvegarde. La garde vérifie ensuite
        # chaque build et ces noyaux : sans preuve, tout est retiré et refait.
        # Ni Linux ni Windows ne compilent MLX.
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/mlx-metallib
          for copie in target/aarch64-apple-darwin/*/build/mlx-sys-*/out/build/lib/mlx.metallib; do
            if [ "$copie" -nt target/mlx-metallib/mlx.metallib ]; then cp -p "$copie" target/mlx-metallib/; fi
          done
          . scripts/mlx-sources.sh
          echo "CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin=$CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin" >> "$GITHUB_ENV"
          echo "MLX_RS_METAL_PATH=$MLX_RS_METAL_PATH" >> "$GITHUB_ENV"
          echo "DYSFLOW_MLX_METALLIB=$DYSFLOW_MLX_METALLIB" >> "$GITHUB_ENV"
      - name: Tests
        # Sur Mac, avec MLX en Rust (compute::mlx) ; sans effet ailleurs.
        run: cargo test --workspace --locked ${{ runner.os == 'macOS' && '--features dysflow-ffi/mlx' || '' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked ${{ runner.os == 'macOS' && '--features dysflow-ffi/mlx' || '' }} -- -D warnings
      - name: Clippy (Kokoro au terminal)
        run: cargo clippy -p dysflow --all-targets --features kokoro-onnx --locked -- -D warnings
      - name: MSRV de MLX en Rust (Mac)
        # La feature mlx (mlx-rs, mlx-sys) doit tenir dans les MSRV : 1.88 pour
        # le cœur, 1.91 pour le moteur de l'app (ffi/). Un échec donne la
        # version qu'elle demande : la MSRV ne se relève pas dans ce job.
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.88 1.91 --profile minimal --no-self-update
          cargo +1.88 check -p dysflow --features mlx --locked ||
            { echo "::error::mlx demande plus que Rust 1.88 (MSRV du cœur) : voir la version requise ci-dessus" >&2; exit 1; }
          cargo +1.91 check -p dysflow-ffi --features mlx --locked ||
            { echo "::error::mlx demande plus que Rust 1.91 (MSRV de ffi/) : voir la version requise ci-dessus" >&2; exit 1; }
      - name: Tests d'ONNX Runtime (Windows)
        # Le chargement d'ONNX Runtime par chemin absolu (lot W) : les essais
        # qui demandent la vraie bibliothèque et le modèle sont ignorés.
        if: runner.os == 'Windows'
        run: cargo test -p dysflow --features kokoro-onnx --lib tts::kokoro::onnx --locked
      - name: Paquet et installation du terminal (ocr, kokoro-onnx)
        if: runner.os == 'Linux'
        # install.sh lance package.sh (build --features ocr,kokoro-onnx,
        # ONNX Runtime vérifié, dysflow-espeak), installe sous PREFIX, puis
        # vérifie depuis / que le binaire démarre et que Kokoro se charge.
        run: PREFIX="$RUNNER_TEMP/prefix" ./scripts/install.sh
      - name: MinGW-w64 (dysflow-espeak, Windows)
        # espeak-ng 1.52.0 ne se compile pas avec MSVC : build-espeak.sh le
        # construit avec gcc d'MSYS2 (UCRT64). Rien n'est ajouté au PATH :
        # seul ce script s'en sert, par MINGW_BIN.
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Paquet et vérification (Windows)
        if: runner.os == 'Windows'
        env:
          MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        # package.sh sous le bash de Git for Windows : build --features
        # ocr,kokoro-onnx, ONNX Runtime du paquet NuGet, dysflow-espeak.exe
        # par CMake et MinGW-w64, puis dist/dysflow-windows-x86_64.zip. L'archive
        # est décompressée dans un dossier dont le chemin porte une espace et
        # un accent, puis dans un autre hors de la page de code Windows-1252
        # (« Ł ») ; le binaire y est vérifié depuis /, sans les variables qui
        # désignent ORT ou espeak ailleurs, comme install.sh sous Linux, et
        # avec un PATH réduit à Windows : aucune DLL de Git, de MinGW ou des
        # outils du runner ne peut masquer une DLL qui manquerait au paquet.
        shell: bash
        run: |
          command -v unzip
          ./scripts/package.sh
          tmp=$(cygpath -u "$RUNNER_TEMP")
          for name in "Élodie Martin" "Łukasz Gaweł"; do
            dest="$tmp/$name/dysflow"
            rm -rf "$dest"
            mkdir -p "$dest" && unzip -q dist/dysflow-windows-x86_64.zip -d "$dest"
            echo "Depuis $dest :"
            for option in --version --check-kokoro; do
              ( cd / && env -u DYSFLOW_ORT_LIB -u DYSFLOW_ESPEAK -u DYSFLOW_ESPEAK_DATA \
                  PATH="/c/Windows/System32:/c/Windows" "$dest/dysflow.exe" "$option" )
            done
          done
      - name: Imports des binaires (Windows)
        # Chaque DLL qu'importent dysflow.exe, onnxruntime.dll, le runtime
        # Visual C++ joint et dysflow-espeak.exe est dans le paquet ou dans
        # Windows ; dysflow-espeak.exe n'importe que KERNEL32, ADVAPI32 et le
        # CRT de Windows (rien de MinGW).
        if: runner.os == 'Windows'
        shell: bash
        run: python -I scripts/windows-imports.py check dist
      - name: Modèles de la porte ONNX Runtime (cache)
        # Silero VAD, Kokoro int8 et sa configuration : empreintes épinglées
        # dans scripts/ort-gate.sh, qui ne retélécharge pas un fichier juste.
        uses: actions/cache@v4
        with:
          path: target/ort-gate-models
          key: ort-gate-models-${{ hashFiles('scripts/ort-gate.sh') }}
      - name: Une seule copie d'ONNX Runtime (Kokoro et sherpa-onnx, lot 1)
        # La porte du lot 1 : examples/ort_single_copy.rs (Clippy compris),
        # compilé avec la bibliothèque C de sherpa-onnx de
        # scripts/sherpa-onnx.sh, lancé depuis un dossier qui a la forme du
        # paquet (target/ort-gate/), à côté de l'ONNX Runtime 1.31 du paquet
        # NuGet. Kokoro int8 parle, Silero VAD y trouve un segment, les deux
        # côtés ont ONNX Runtime 1.31.0, et une seule copie en est chargée.
        shell: bash
        run: ./scripts/ort-gate.sh
      - name: Porte ONNX Runtime jointe
        # Pour la vérifier sur un PC : tar xzf ort-gate.tar.gz, puis
        # ort-gate/ort_single_copy (voir scripts/ort-gate.sh).
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ort-gate-${{ runner.os }}-${{ runner.arch }}
          path: target/ort-gate.tar.gz
          retention-days: 7
      - name: Paquet joint
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dysflow-${{ runner.os }}-${{ runner.arch }}
          # Le dossier seulement : l'archive Windows en est la copie.
          path: |
            dist/
            !dist/*.zip
          retention-days: 7

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake clang
      - name: Chaînes Rust du MSRV
        # 1.88 : rust-version de dysflow (Cargo.toml). 1.91 : le moteur de
        # l'app (ffi/, cargo-platform 0.3.3 par uniffi).
        run: rustup toolchain install 1.88 1.91 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: dysflow en 1.88, toutes features
        run: cargo +1.88 check -p dysflow --all-features --all-targets --locked
      - name: Espace de travail en 1.91
        run: cargo +1.91 check --workspace --all-targets --locked

  lint:
    name: Licences et scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: THIRD-PARTY-RUST.txt à jour
        run: python3 -I scripts/third-party-rust.py --check
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: langue de install.sh
        run: sh scripts/test-install-lang.sh

  macos-app:
    name: App macOS
    # Xcode 26 au moins : mlx-swift demande Swift 6.3 (macos-14 s'arrête à
    # Xcode 16).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Outils
        run: |
          brew install xcodegen
          rustup update stable --no-self-update
          rustup default stable
      - name: Metal Toolchain (noyaux MLX)
        # DYSFLOW_MLX_CACHE : comme dans le job Rust, sans le macOS de l'hôte
        # (les noyaux visent macOS 14).
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "DYSFLOW_MLX_CACHE=mlx-$({ cat scripts/mlx-sources.sh scripts/mlx-sources.cmake; xcodebuild -version; } | shasum -a 256 | cut -c1-12)" >> "$GITHUB_ENV"
      # Garde target/, donc MLX compilé par mlx-sys (CMake, ~4 min) : il ne se
      # recompile pas d'une exécution à l'autre tant que la clé ne change pas.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.DYSFLOW_MLX_CACHE }}
      - name: Sources épinglées de MLX, en cache
        # Après rust-cache, pour la même raison que dans le job Rust.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mlx-sources
          key: mlx-sources-${{ hashFiles('scripts/mlx-sources.sh') }}
      - name: dysflow-espeak
        run: ./scripts/build-espeak.sh
      - name: Moteur et liaison Swift
        id: ffi
        # Le build de test : avec la copie Rust de MLX (feature mlx), que l'app
        # livrée n'a pas avant le lot 3 (scripts/build-macos.sh la refuse).
        # MLXCoexistenceTests vérifie ainsi la décision « Lot 0 » ; sans
        # DYSFLOW_MLX_RUST, ce test serait sauté : la CI le refuse.
        # Les noyaux du build en cache : comme dans le job Rust.
        run: |
          mkdir -p target/mlx-metallib/macos-14.0
          for copie in target/app/build/mlx-sys-*/out/build/lib/mlx.metallib; do
            if [ "$copie" -nt target/mlx-metallib/macos-14.0/mlx.metallib ]; then cp -p "$copie" target/mlx-metallib/macos-14.0/; fi
          done
          FEATURES=ocr,mlx ./scripts/build-ffi.sh
          grep -qx 'DYSFLOW_FFI_CONDITIONS = DYSFLOW_MLX_RUST' macos/Generated/Link.xcconfig
      - name: Tests de l'app
        # Les tests d'interface (DysflowUITests) pilotent l'app à l'écran et
        # demandent l'accès Accessibilité : hors CI. Le script ne lance que
        # DysflowTests, en headless, comme en local.
        run: ./scripts/test-macos.sh
      - name: Textes sans français (catalogue)
        # Bloquant : après la compilation des tests (le script lit les
        # .stringsdata de build/derived), même si les tests ont échoué, du
        # moment que le moteur a été construit. Il synchronise aussi le
        # catalogue avec le code.
        if: ${{ !cancelled() && steps.ffi.conclusion == 'success' }}
        run: ./scripts/check-xcstrings.sh
      - name: Catalogue à jour
        # Le script a réécrit le catalogue : une différence avec le dépôt est
        # une synchronisation oubliée (clé nouvelle ou périmée).
        if: ${{ !cancelled() && steps.ffi.conclusion == 'success' }}
        run: git diff --exit-code macos/Resources/Localizable.xcstrings
