# Intégration continue : tests et lint Rust sur les plateformes visées
# (Linux x86_64 et ARM64, macOS Apple Silicon, Windows x86_64), paquet du
# terminal et app de bureau (dysflow-app, GPUI) sous Linux et Windows, MSRV,
# licences, scripts, et tests de l'app macOS.
name: CI

on:
  push:
    branches: [main]
    # Les publications : le bout en bout et la mise à jour tournent aussi
    # sur l'étiquette (R49).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Aucun ONNX Runtime lancé par un job (essais, paquet, binaires du
  # paquet) n'écrit ni n'envoie sa télémétrie (onnx::NO_TELEMETRY).
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 : l'image macos-14 est retirée le 2 novembre 2026
        # (actions/runner-images#13518).
        # windows-2025 : le cœur et le terminal se compilent et se testent
        # sous Windows, et le paquet Windows y est construit (lot W).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bout en bout et mise à jour à lancer ? (chemins touchés)
        # R49 : la mise à jour et le bout en bout (≈ 778 Mo de modèles par
        # système) tournent sur main, les étiquettes v* et à la demande ;
        # sur une PR, seulement si elle touche le paquet, la dictée, la voix
        # Kokoro, Cargo.lock, les épingles ou ce fichier. Par git diff, sans
        # action de plus : la PR contre sa base (un seul commit récupéré).
        id: lourd
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "oui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          oui=false
          while IFS= read -r fichier; do
            case "$fichier" in
            install.sh | Cargo.lock | .github/workflows/ci.yml | \
              scripts/package.sh | scripts/install.sh | scripts/paquet-commun.sh | \
              scripts/sherpa-onnx.sh | scripts/build-espeak.sh | scripts/dysflow-espeak.c | \
              scripts/elf-version-ref.py | scripts/windows-imports.py | \
              scripts/glibc-max.py | app/* | \
              scripts/paquet-bout-en-bout.sh | scripts/test-mise-a-jour.sh | \
              scripts/modeles-epingles.sh | scripts/modeles-epingles.txt | \
              src/stt/* | src/tts/kokoro/*)
              echo "Touché : $fichier"
              oui=true ;;
            esac
          done <<EOF
          $(git diff --name-only "$BASE" HEAD)
          EOF
          echo "oui=$oui" >> "$GITHUB_OUTPUT"
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        # ALSA pour rodio/cpal ; cmake et clang pour Tesseract (feature ocr)
        # et espeak-ng (build-espeak.sh) ; et ce que lient les crates de GPUI
        # (dysflow-app, dans l'espace de travail : essais, Clippy et paquet),
        # lu dans les sources de gpui-pre-linux 0.3.14 :
        # - libxkbcommon-dev, libxkbcommon-x11-dev : xkbcommon 0.8 lie
        #   libxkbcommon et libxkbcommon-x11 (#[link]), claviers Wayland et X11 ;
        # - libxcb1-dev : x11rb (feature xcb_ffi) lie libxcb ;
        # - libfontconfig-dev : yeslogic-fontconfig-sys (font-kit) la cherche par
        #   pkg-config ;
        # - libfreetype-dev : freetype-sys la prend par pkg-config, sinon
        #   compile ses propres sources en C++ (long) ;
        # - Wayland (wayland-backend, feature dlopen), Vulkan (ash) et EGL
        #   (khronos-egl, feature dynamic) se chargent à l'exécution : aucun
        #   paquet de développement, et les essais (plateforme de test de GPUI)
        #   n'ouvrent ni fenêtre ni GPU ; ni xvfb, ni mesa-vulkan.
        # libxcb-xkb-dev, libxcb-xinput-dev… viennent en dépendances de ces
        # paquets -dev. Ni libssl ni libzstd : absents du graphe d'app/.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Chaîne Rust stable
        # dysflow-app demande Rust 1.100 (rust-version d'app/Cargo.toml, GPUI) :
        # la stable, que cette étape met à jour, le satisfait ; un runner qui
        # aurait une stable plus ancienne ferait échouer cargo en le disant.
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version
      - name: Metal Toolchain et cible explicite (MLX de mlx-rs)
        # Sur Mac, Tests et Clippy activent la feature mlx de ffi/ (hors de
        # l'app livrée jusqu'au lot 3) : MLX compilé par CMake, dont les
        # noyaux demandent le compilateur Metal.
        # La cible explicite sépare toujours les dépendances de build de
        # celles du code : Tests et Clippy voient alors le même mlx-sys et
        # partagent un seul build de MLX. Sans elle, cargo partage ces
        # dépendances avec le code en test mais pas en clippy (qui ne les
        # compile qu'en métadonnées), et MLX se recompile (~8 min).
        # DYSFLOW_MLX_CACHE : la clé du cache de target/ (voir la garde de
        # scripts/mlx-sources.sh). Elle suit ce que la garde vérifie (ses deux
        # scripts, et le macOS de l'hôte, cible des noyaux) et Xcode, dont
        # mlx-sys suit les en-têtes : sinon, un cache qu'elle refuse serait
        # repris tel quel à chaque exécution, et MLX recompilé chaque fois.
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "CARGO_BUILD_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "DYSFLOW_MLX_CACHE=mlx-$({ cat scripts/mlx-sources.sh scripts/mlx-sources.cmake; sw_vers -productVersion | cut -d. -f1,2; xcodebuild -version; } | shasum -a 256 | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # Vide hors de Mac : clé inchangée sous Linux et Windows.
          key: ${{ env.DYSFLOW_MLX_CACHE }}
      - name: Sources épinglées de MLX, en cache (Mac)
        # Après rust-cache : son post, qui vide target/mlx-sources, passe
        # après celui-ci, qui sauve.
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mlx-sources
          key: mlx-sources-${{ hashFiles('scripts/mlx-sources.sh') }}
      - name: Sources épinglées de MLX (Mac)
        # rust-cache vide target/mlx-metallib avant de sauver, mais chaque
        # build de mlx-sys garde ses noyaux (out/build/lib). La copie la plus
        # récente est celle d'avant la sauvegarde. La garde vérifie ensuite
        # chaque build et ces noyaux : sans preuve, tout est retiré et refait.
        # Ni Linux ni Windows ne compilent MLX.
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/mlx-metallib
          for copie in target/aarch64-apple-darwin/*/build/mlx-sys-*/out/build/lib/mlx.metallib; do
            if [ "$copie" -nt target/mlx-metallib/mlx.metallib ]; then cp -p "$copie" target/mlx-metallib/; fi
          done
          . scripts/mlx-sources.sh
          echo "CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin=$CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin" >> "$GITHUB_ENV"
          echo "MLX_RS_METAL_PATH=$MLX_RS_METAL_PATH" >> "$GITHUB_ENV"
          echo "DYSFLOW_MLX_METALLIB=$DYSFLOW_MLX_METALLIB" >> "$GITHUB_ENV"
      - name: Clé des archives épinglées (ONNX Runtime, sherpa-onnx)
        # Les seules lignes de version et d'empreinte des deux archives : un
        # autre changement de ces scripts ne vide pas le cache.
        id: archives
        shell: bash
        run: |
          cle=$(grep -hE '^ *(ORT_VERSION|ORT_SHA256|SHERPA_VERSION|SHERPA_SHA256)=' \
            scripts/paquet-commun.sh scripts/sherpa-onnx.sh | tr -d '\r ' | git hash-object --stdin)
          echo "cle=$cle" >> "$GITHUB_OUTPUT"
      - name: Archives d'ONNX Runtime et de sherpa-onnx (cache)
        # Le paquet NuGet d'ONNX Runtime (≈ 160 Mo) et la bibliothèque C de
        # sherpa-onnx (≈ 9 Mo), que ort_fetch et sherpa_fetch vérifient par
        # leur SHA-256 et ne retéléchargent pas quand ils sont justes. Après
        # rust-cache : son post, qui vide target/, passe après celui-ci.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ort/*.nupkg
            target/sherpa-onnx/*.tar.bz2
          key: archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.archives.outputs.cle }}
      - name: Clés des caches de modèles (lignes épinglées)
        # Chaque cache sous l'empreinte des seules lignes de
        # scripts/modeles-epingles.txt qu'il garde : une épingle de Parakeet
        # qui change ne vide pas le cache de la porte, ni l'inverse.
        id: cles
        shell: bash
        run: |
          echo "porte=$(tr -d '\r' < scripts/modeles-epingles.txt | grep -E '^(silero_vad\.onnx |kokoro/)' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          echo "parakeet=$(tr -d '\r' < scripts/modeles-epingles.txt | grep -E '^parakeet_tdt_v3/' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - name: Modèles de la porte (cache)
        # R51 : Silero VAD et Kokoro int8 (≈ 93 Mo ; avec les 29 voix sous
        # Linux x86_64 et Windows, ≈ 108 Mo), restaurés partout, puisque la
        # porte tourne partout. Kokoro n'est gardé qu'ici : le bout en bout le
        # lit dans ce cache. runner.arch dans la clé : Linux x86_64 et ARM64
        # n'ont pas le même contenu.
        id: modeles-porte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/modeles/silero_vad.onnx
            ${{ runner.temp }}/modeles/kokoro
          key: modeles-porte-${{ runner.os }}-${{ runner.arch }}-${{ steps.cles.outputs.porte }}
      - name: Dossier des modèles des essais (MODELS)
        # Lu par la porte (ort-gate.sh) et par package.sh, qui y prend
        # silero_vad.onnx au lieu de le retélécharger.
        shell: bash
        run: echo "MODELS=$(cd "$RUNNER_TEMP" && pwd)/modeles" >> "$GITHUB_ENV"
      - name: Voix de Kokoro, cache de la porte absent (Linux x86_64, Windows)
        # Un cache de la porte refait l'est avec les voix là où le bout en
        # bout tourne, même sur une PR qui ne le lance pas : sinon, sauvé
        # sans elles, il serait repris tel quel et les voix retéléchargées à
        # chaque bout en bout.
        if: steps.modeles-porte.outputs.cache-hit != 'true' && (runner.os == 'Windows' || matrix.os == 'ubuntu-24.04')
        shell: bash
        run: ./scripts/modeles-epingles.sh "$MODELS" silero_vad.onnx kokoro/
      - name: Tests
        # Sur Mac, avec MLX en Rust (compute::mlx) ; sans effet ailleurs.
        # --workspace comprend dysflow-app : ses essais passent par la
        # plateforme de test de GPUI (TestAppContext), sans GPU ni serveur
        # graphique, sur les quatre systèmes.
        run: cargo test --workspace --locked ${{ runner.os == 'macOS' && '--features dysflow-ffi/mlx' || '' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked ${{ runner.os == 'macOS' && '--features dysflow-ffi/mlx' || '' }} -- -D warnings
      - name: Clippy (Kokoro au terminal)
        run: cargo clippy -p dysflow --all-targets --features kokoro-onnx --locked -- -D warnings
      - name: MSRV de MLX en Rust (Mac)
        # La feature mlx (mlx-rs, mlx-sys) doit tenir dans les MSRV : 1.88 pour
        # le cœur, 1.91 pour le moteur de l'app (ffi/). Un échec donne la
        # version qu'elle demande : la MSRV ne se relève pas dans ce job.
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.88 1.91 --profile minimal --no-self-update
          cargo +1.88 check -p dysflow --features mlx --locked ||
            { echo "::error::mlx demande plus que Rust 1.88 (MSRV du cœur) : voir la version requise ci-dessus" >&2; exit 1; }
          cargo +1.91 check -p dysflow-ffi --features mlx --locked ||
            { echo "::error::mlx demande plus que Rust 1.91 (MSRV de ffi/) : voir la version requise ci-dessus" >&2; exit 1; }
      - name: Tests d'ONNX Runtime (Windows)
        # Le chargement d'ONNX Runtime par chemin absolu (lot W) : les essais
        # qui demandent la vraie bibliothèque et le modèle sont ignorés.
        if: runner.os == 'Windows'
        run: cargo test -p dysflow --features kokoro-onnx --lib tts::kokoro::onnx --locked
      - name: Paquet et installation, terminal et app (ocr, kokoro-onnx, stt-sherpa)
        if: runner.os == 'Linux'
        # install.sh lance package.sh (build --features ocr,kokoro-onnx,
        # stt-sherpa, ONNX Runtime vérifié, dysflow-espeak, bibliothèque C de
        # sherpa-onnx et Silero VAD), installe sous PREFIX, puis vérifie
        # depuis / que le binaire démarre (bibliothèque C chargée) et que
        # Kokoro se charge. DYSFLOW_DESKTOP=1 : avec l'app de bureau, comme le
        # paquet publié (bin/dysflow-app, licences OFL des polices).
        run: DYSFLOW_DESKTOP=1 PREFIX="$RUNNER_TEMP/prefix" ./scripts/install.sh
      - name: Mise à jour depuis la dernière publication (Linux x86_64)
        # install.sh de la racine installe la dernière version publiée sur
        # GitHub, puis met à jour vers le paquet de dist/ (servi en local,
        # comme GitHub le sert) : --version et --check-kokoro passent, et le
        # dossier installé est bien le nouveau paquet (dictée comprise).
        # x86_64 seulement : la logique ne dépend pas de l'architecture, et
        # chaque passage télécharge la publication (~ la taille du paquet) ;
        # sur main, les étiquettes v*, à la demande, ou une PR qui touche le
        # paquet (R49).
        if: matrix.os == 'ubuntu-24.04' && steps.lourd.outputs.oui == 'true'
        run: ./scripts/test-mise-a-jour.sh dist
      - name: MinGW-w64 (dysflow-espeak, Windows)
        # espeak-ng 1.52.0 ne se compile pas avec MSVC : build-espeak.sh le
        # construit avec gcc d'MSYS2 (UCRT64). Rien n'est ajouté au PATH :
        # seul ce script s'en sert, par MINGW_BIN.
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Paquet et vérification (Windows)
        if: runner.os == 'Windows'
        env:
          MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        # package.sh sous le bash de Git for Windows : build --features
        # ocr,kokoro-onnx, ONNX Runtime du paquet NuGet, dysflow-espeak.exe
        # par CMake et MinGW-w64, puis dist/dysflow-windows-x86_64.zip. L'archive
        # est décompressée dans un dossier dont le chemin porte une espace et
        # un accent, puis dans un autre hors de la page de code Windows-1252
        # (« Ł ») ; le binaire y est vérifié depuis /, sans les variables qui
        # désignent ORT ou espeak ailleurs, comme install.sh sous Linux, et
        # avec un PATH réduit à Windows : aucune DLL de Git, de MinGW ou des
        # outils du runner ne peut masquer une DLL qui manquerait au paquet.
        shell: bash
        run: |
          command -v unzip
          # Avec l'app de bureau (dysflow-app.exe), qu'exige windows-imports.py.
          DYSFLOW_DESKTOP=1 ./scripts/package.sh
          tmp=$(cygpath -u "$RUNNER_TEMP")
          for name in "Élodie Martin" "Łukasz Gaweł"; do
            dest="$tmp/$name/dysflow"
            rm -rf "$dest"
            mkdir -p "$dest" && unzip -q dist/dysflow-windows-x86_64.zip -d "$dest"
            echo "Depuis $dest :"
            # --version : dysflow.exe démarre, donc sherpa-onnx-c-api.dll et
            # onnxruntime.dll se chargent depuis le dossier du paquet.
            for option in --version --check-kokoro; do
              ( cd / && env -u DYSFLOW_ORT_LIB -u DYSFLOW_ESPEAK -u DYSFLOW_ESPEAK_DATA \
                  PATH="/c/Windows/System32:/c/Windows" "$dest/dysflow.exe" "$option" )
            done
          done
      - name: Imports des binaires (Windows)
        # Chaque DLL qu'importent dysflow.exe, onnxruntime.dll,
        # sherpa-onnx-c-api.dll, le runtime Visual C++ joint et
        # dysflow-espeak.exe (exigé) est à côté de son binaire ou dans la
        # liste blanche des DLL de Windows, sous-dossiers compris ;
        # dysflow-espeak.exe n'importe que KERNEL32, ADVAPI32 et le CRT de
        # Windows (rien de MinGW).
        if: runner.os == 'Windows'
        shell: bash
        run: python -I scripts/windows-imports.py check dist
      - name: Phonétisation réelle et coût des lots de 2 Kio (Windows)
        # Le vrai dysflow-espeak.exe du paquet, par les tubes de Windows et
        # le fil d'écriture : chaque entrée reçoit ses phonèmes, une entrée
        # trop longue l'arrête, et le temps d'une requête de 39 Ko en lots de
        # 2 Kio puis de 8 Kio est affiché (the_cost_of_small_batches).
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DYSFLOW_ESPEAK="$PWD/dist/dysflow-espeak.exe" DYSFLOW_ESPEAK_DATA="$PWD/dist" \
            cargo test --workspace --locked --lib tts::kokoro::phonemes::tests::the_ -- --ignored --nocapture --test-threads=1
      - name: Modèles de Parakeet (cache, bout en bout seulement)
        # R51 : Parakeet v3 int8 et son échantillon français (≈ 671 Mo),
        # restaurés seulement quand le bout en bout tourne. Un cache absent
        # est rempli par le bout en bout lui-même (modeles-epingles.sh).
        if: (runner.os == 'Windows' || matrix.os == 'ubuntu-24.04') && steps.lourd.outputs.oui == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/modeles/parakeet_tdt_v3
          key: modeles-parakeet-${{ runner.os }}-${{ runner.arch }}-${{ steps.cles.outputs.parakeet }}
      - name: Bout en bout depuis le paquet (Linux x86_64, Windows)
        # Depuis le paquet (sous Windows, l'archive décompressée sous
        # « Łukasz Gaweł ») : dysflow -o écrit le texte de référence avec
        # Kokoro, puis --transcribe dicte l'échantillon français de référence
        # et ce WAV (Parakeet v3 int8, Silero VAD du paquet), WER bornés.
        # Les modèles des deux caches (Kokoro et Silero : celui de la porte ;
        # Parakeet : le sien) : liés sous Linux, copiés sous Windows (le
        # profil du runner). Sur main, les étiquettes v*, à la
        # demande, ou une PR qui touche le paquet (R49).
        if: (runner.os == 'Windows' || matrix.os == 'ubuntu-24.04') && steps.lourd.outputs.oui == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            paquet="$(cygpath -u "$RUNNER_TEMP")/Łukasz Gaweł/dysflow"
          else
            paquet=dist
          fi
          ./scripts/paquet-bout-en-bout.sh "$paquet" "$MODELS"
      - name: Une seule copie d'ONNX Runtime (Kokoro et sherpa-onnx, lot 1)
        # La porte du lot 1 : examples/ort_single_copy.rs (Clippy compris),
        # compilé avec la bibliothèque C de sherpa-onnx de
        # scripts/sherpa-onnx.sh, lancé depuis un dossier qui a la forme du
        # paquet (target/ort-gate/), à côté de l'ONNX Runtime 1.31 du paquet
        # NuGet. Kokoro int8 parle, Silero VAD y trouve un segment, les deux
        # côtés ont ONNX Runtime 1.31.0, et une seule copie en est chargée.
        # Ses modèles (Silero, Kokoro) : le cache des essais (MODELS).
        shell: bash
        run: ./scripts/ort-gate.sh
      - name: Porte ONNX Runtime jointe
        # Pour la vérifier sur un PC : tar xzf ort-gate.tar.gz, puis
        # ort-gate/ort_single_copy (voir scripts/ort-gate.sh).
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ort-gate-${{ runner.os }}-${{ runner.arch }}
          path: target/ort-gate.tar.gz
          retention-days: 7
      - name: Paquet joint
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dysflow-${{ runner.os }}-${{ runner.arch }}
          # Le dossier seulement : l'archive Windows en est la copie.
          path: |
            dist/
            !dist/*.zip
          retention-days: 7

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Chaînes Rust du MSRV
        # 1.88 : rust-version de dysflow (Cargo.toml). 1.91 : le moteur de
        # l'app (ffi/, cargo-platform 0.3.3 par uniffi). 1.100 : l'app de
        # bureau (app/, GPUI), qui a son propre plancher.
        run: rustup toolchain install 1.88 1.91 1.100 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Clé des archives épinglées (ONNX Runtime, sherpa-onnx)
        id: archives
        run: |
          cle=$(grep -hE '^ *(ORT_VERSION|ORT_SHA256|SHERPA_VERSION|SHERPA_SHA256)=' \
            scripts/paquet-commun.sh scripts/sherpa-onnx.sh | tr -d '\r ' | git hash-object --stdin)
          echo "cle=$cle" >> "$GITHUB_OUTPUT"
      - name: Archives d'ONNX Runtime et de sherpa-onnx (cache)
        # Le même cache que le job Rust sous Linux x86_64 : sherpa_fetch
        # ne retélécharge ni le paquet NuGet (≈ 160 Mo) ni sherpa-onnx.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ort/*.nupkg
            target/sherpa-onnx/*.tar.bz2
          key: archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.archives.outputs.cle }}
      - name: dysflow en 1.88, toutes features
        # stt-sherpa avec les --config de scripts/sherpa-onnx.sh, comme le
        # paquet et la porte : sans eux, le script de build de
        # sherpa-onnx-sys téléchargerait sa propre archive, avec ONNX Runtime
        # 1.28.2.
        run: |
          PYTHON=python3
          . scripts/paquet-commun.sh
          . scripts/sherpa-onnx.sh
          sherpa_fetch
          cargo +1.88 check -p dysflow --all-features --all-targets --locked \
            --config "$SHERPA_CONFIG_SEARCH" --config "$SHERPA_CONFIG_LIB"
      - name: Espace de travail en 1.91
        # Sans dysflow-app : il demande 1.100 (GPUI) ; la MSRV du cœur (1.88)
        # et celle de ffi/ (1.91) ne changent pas.
        run: cargo +1.91 check --workspace --exclude dysflow-app --all-targets --locked
      - name: App de bureau en 1.100
        # Son rust-version est une promesse : la CI la tient. Un échec donne
        # la version qu'une dépendance demande ; elle ne se relève pas ici
        # sans décision.
        run: cargo +1.100 check -p dysflow-app --all-targets --features onnx,ocr --locked

  lint:
    name: Licences et scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: THIRD-PARTY-RUST.txt à jour
        run: python3 -I scripts/third-party-rust.py --check
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: Imports Windows (binaires fabriqués)
        # La liste blanche de scripts/windows-imports.py, sur des PE32+
        # fabriqués : sous-dossiers, dysflow-espeak.exe exigé, DLL inconnue.
        run: python3 -I scripts/test_windows_imports.py
      - name: Plancher de glibc (ELF fabriqués)
        # scripts/glibc-max.py, que package.sh lance sur dysflow et
        # dysflow-app sous Linux : refuse un binaire qui demande plus que 2.39.
        run: python3 -I scripts/test_glibc_max.py
      - name: langue de install.sh
        run: sh scripts/test-install-lang.sh

  macos-app:
    name: App macOS
    # Xcode 26 au moins : mlx-swift demande Swift 6.3 (macos-14 s'arrête à
    # Xcode 16).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Outils
        run: |
          brew install xcodegen
          rustup update stable --no-self-update
          rustup default stable
      - name: Metal Toolchain (noyaux MLX)
        # DYSFLOW_MLX_CACHE : comme dans le job Rust, sans le macOS de l'hôte
        # (les noyaux visent macOS 14).
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "DYSFLOW_MLX_CACHE=mlx-$({ cat scripts/mlx-sources.sh scripts/mlx-sources.cmake; xcodebuild -version; } | shasum -a 256 | cut -c1-12)" >> "$GITHUB_ENV"
      # Garde target/, donc MLX compilé par mlx-sys (CMake, ~4 min) : il ne se
      # recompile pas d'une exécution à l'autre tant que la clé ne change pas.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.DYSFLOW_MLX_CACHE }}
      - name: Sources épinglées de MLX, en cache
        # Après rust-cache, pour la même raison que dans le job Rust.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mlx-sources
          key: mlx-sources-${{ hashFiles('scripts/mlx-sources.sh') }}
      - name: dysflow-espeak
        run: ./scripts/build-espeak.sh
      - name: Moteur et liaison Swift
        id: ffi
        # Le build de test : avec la copie Rust de MLX (feature mlx), que l'app
        # livrée n'a pas avant le lot 3 (scripts/build-macos.sh la refuse).
        # MLXCoexistenceTests vérifie ainsi la décision « Lot 0 » ; sans
        # DYSFLOW_MLX_RUST, ce test serait sauté : la CI le refuse.
        # Les noyaux du build en cache : comme dans le job Rust.
        run: |
          mkdir -p target/mlx-metallib/macos-14.0
          for copie in target/app/build/mlx-sys-*/out/build/lib/mlx.metallib; do
            if [ "$copie" -nt target/mlx-metallib/macos-14.0/mlx.metallib ]; then cp -p "$copie" target/mlx-metallib/macos-14.0/; fi
          done
          FEATURES=ocr,mlx ./scripts/build-ffi.sh
          grep -qx 'DYSFLOW_FFI_CONDITIONS = DYSFLOW_MLX_RUST' macos/Generated/Link.xcconfig
      - name: Tests de l'app
        # Les tests d'interface (DysflowUITests) pilotent l'app à l'écran et
        # demandent l'accès Accessibilité : hors CI. Le script ne lance que
        # DysflowTests, en headless, comme en local.
        run: ./scripts/test-macos.sh
      - name: Textes sans français (catalogue)
        # Bloquant : après la compilation des tests (le script lit les
        # .stringsdata de build/derived), même si les tests ont échoué, du
        # moment que le moteur a été construit. Il synchronise aussi le
        # catalogue avec le code.
        if: ${{ !cancelled() && steps.ffi.conclusion == 'success' }}
        run: ./scripts/check-xcstrings.sh
      - name: Catalogue à jour
        # Le script a réécrit le catalogue : une différence avec le dépôt est
        # une synchronisation oubliée (clé nouvelle ou périmée).
        if: ${{ !cancelled() && steps.ffi.conclusion == 'success' }}
        run: git diff --exit-code macos/Resources/Localizable.xcstrings
