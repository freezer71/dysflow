# Publication, à chaque tag `v*` :
# - le lecteur au terminal pour Linux (x86_64 et ARM64) : scripts/install.sh
#   assemble le paquet (ocr, kokoro-onnx), l'installe et le vérifie depuis / ;
#   le dossier dist/ part en archive, avec son empreinte ;
# - l'app macOS : construite (signée Developer ID et notariée si les secrets
#   MACOS_* et NOTARY_* sont là, sinon ad hoc), emballée en .zip (pour
#   install.sh à la racine, `curl | sh`) et en .dmg, chacun avec son empreinte.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (v0.2.0…)"
        required: true
      publier:
        description: "Publier sur GitHub (sinon : construire seulement, artefacts joints au passage)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # À blanc (publier décoché) : la branche lancée, pas le tag. Sur un
          # push de tag, `inputs` est vide : d'où le test de l'événement.
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publier && github.ref || env.TAG }}
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake clang
      - name: Chaîne Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Version du tag et de Cargo.toml
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publier }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Le tag $TAG ne correspond pas à la version $version de Cargo.toml" >&2
            exit 1
          fi
      - name: Paquet, installation et vérification
        run: PREFIX="$RUNNER_TEMP/prefix" ./scripts/install.sh
      - name: Archive
        id: archive
        run: |
          # Le nom de l'archive ne porte pas la version : l'adresse
          # /releases/latest/download/<nom> reste la même d'une version à
          # l'autre (le site et install.sh y pointent). Le dossier, lui, la porte.
          dossier="dysflow-${TAG#v}-linux-${{ matrix.arch }}"
          name="dysflow-linux-${{ matrix.arch }}"
          mv dist "$dossier"
          tar -czf "$name.tar.gz" "$dossier"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256

  macos:
    name: App macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # À blanc (publier décoché) : la branche lancée, pas le tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publier && github.ref || env.TAG }}
      - name: Xcode le plus récent
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Outils
        run: |
          brew install xcodegen uv
          rustup update stable --no-self-update
          rustup default stable
      - name: Metal Toolchain (noyaux MLX)
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Version du tag, de Cargo.toml et de l'app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publier }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=$(sed -n 's/^ *MARKETING_VERSION: *//p' macos/project.yml | head -1)
          if [ "v$version" != "$TAG" ] || [ "$version" != "$app" ]; then
            echo "Le tag $TAG, Cargo.toml ($version) et macos/project.yml ($app) ne concordent pas" >&2
            exit 1
          fi
      - name: dmgbuild (empreintes vérifiées)
        # Avant le trousseau : ce qui s'installe ici ne voit aucun secret, et
        # chaque paquet doit avoir l'empreinte de scripts/dmg/requirements.txt.
        run: |
          uv venv "$RUNNER_TEMP/dmgbuild"
          VIRTUAL_ENV="$RUNNER_TEMP/dmgbuild" uv pip install --require-hashes -r scripts/dmg/requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      - name: Certificat Developer ID et clé de notarisation
        # Sans les secrets (une bifurcation du dépôt…), rien ici : l'app est
        # signée ad hoc, comme avant, et n'est pas notariée.
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGNATURE: ${{ secrets.MACOS_SIGNATURE }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$SIGNATURE" ]; then
            echo "Pas de certificat : signature ad hoc, sans notarisation"
            exit 0
          fi
          # Un trousseau jetable, ouvert le temps du travail.
          trousseau="$RUNNER_TEMP/signature.keychain-db"
          mdp=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$mdp" "$trousseau"
          security set-keychain-settings -lut 3600 "$trousseau"
          security unlock-keychain -p "$mdp" "$trousseau"
          security import "$RUNNER_TEMP/cert.p12" -k "$trousseau" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$mdp" "$trousseau" >/dev/null
          security list-keychains -d user -s "$trousseau" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$trousseau" | grep -q "$SIGNATURE" \
            || { echo "Le certificat « $SIGNATURE » n'est pas dans MACOS_CERT_P12" >&2; exit 1; }
          echo "DYSFLOW_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notarisation.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notarisation.p8" >> "$GITHUB_ENV"
          fi
      - name: Construction de l'app
        run: ./scripts/build-macos.sh
      - name: Emballage (.zip et .dmg), notarisation
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./scripts/package-macos.sh
      - name: install.sh installe l'archive
        # Le script de la racine, sur l'archive qu'on vient de faire, servie
        # comme GitHub la servira : empreinte vérifiée, app posée, commande.
        run: |
          srv="$RUNNER_TEMP/srv/releases/download/$TAG"
          mkdir -p "$srv" "$RUNNER_TEMP/apps"
          cp dist/*.zip dist/*.zip.sha256 "$srv/"
          (cd "$RUNNER_TEMP/srv" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          DYSFLOW_DEPOT=http://localhost:8765 DYSFLOW_VERSION="${TAG#v}" \
            DYSFLOW_APPLICATIONS="$RUNNER_TEMP/apps" PREFIX="$RUNNER_TEMP/prefix" sh install.sh
          codesign --verify --deep --strict "$RUNNER_TEMP/apps/Dysflow.app"
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            # Notariée : Gatekeeper l'accepte telle qu'on la télécharge.
            spctl --assess --type execute -vv "$RUNNER_TEMP/apps/Dysflow.app"
          fi
          test -x "$RUNNER_TEMP/prefix/bin/dysflow"
      - uses: actions/upload-artifact@v4
        with:
          name: dysflow-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256

  publish:
    name: Publication
    needs: [linux, macos]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publier }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # À blanc (publier décoché) : la branche lancée, pas le tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publier && github.ref || env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - name: install.sh joint
        run: cp install.sh paquets/
      - name: Publication GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" paquets/* --clobber
          else
            gh release create "$TAG" paquets/* --title "dysflow ${TAG#v}" --notes-file .github/release-notes.md
          fi
