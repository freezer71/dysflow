[package]
name = "sillon"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Lecteur audio TUI en streaming : lit du markdown pipé ou un fichier, le hiérarchise et le synthétise via audio.cpp"
license = "MIT"

[dependencies]
ratatui = "0.28.0"
crossterm = "0.28.1"
pulldown-cmark = "0.12.0"
pdf-extract = "0.12.0"
tesseract-rs = { version = "0.4", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "webp",
    "bmp",
] }
arboard = { version = "3.6", optional = true }
rodio = { version = "0.19.0", default-features = false }
crossbeam-channel = "0.5.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
dirs = "5.0"
anyhow = "1.0"
hound = "3.5"
ureq = "2.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cmake = { version = "0.1", optional = true }
cc = { version = "1.1", optional = true }

[features]
# Par défaut le binaire se construit en secondes et se replie sur le TTS système.
default = ["clipboard"]
# Compile et lie audio.cpp dans le binaire (nécessite CMake + le submodule vendor/audio.cpp).
audio-cpp = ["dep:cmake", "dep:cc"]
# Donne accès au presse-papiers : coller du texte ne demande rien de plus.
clipboard = ["dep:arboard"]
# Compile Tesseract dans le binaire pour lire images et scans, presse-papiers
# compris — la reconnaissance s'ajoute au collage, elle ne le conditionne pas.
ocr = ["dep:tesseract-rs", "dep:image", "clipboard"]

[[bin]]
name = "sillon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Le rendu TUI et la synthèse restent fluides même en debug.
[profile.dev.package."*"]
opt-level = 2




[[example]]
name = "switch"
required-features = ["audio-cpp"]

[[example]]
name = "switch_app"
required-features = ["audio-cpp"]

[[example]]
name = "magpie_bench"
required-features = ["audio-cpp"]
