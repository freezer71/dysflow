[workspace]
members = [".", "ffi", "ffi/bindgen"]

[package]
name = "dysflow"
version = "0.6.1"
edition = "2021"
# Le plus haut `rust-version` des crates que dysflow compile (Cargo.lock,
# toutes features : image 0.25.10, darling 0.24…) ; vérifié par la CI (job
# msrv). Le moteur de l'app (ffi/, par uniffi → cargo_metadata →
# cargo-platform 0.3.3) demande 1.91.
rust-version = "1.88"
description = "Lecteur à voix haute et dictée pour les personnes dyslexiques et neuroatypiques : lit un document en surlignant chaque mot (Kokoro, ou la voix du système)"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pulldown-cmark = "0.12.0"
pdf-extract = "0.12.0"
tesseract-rs = { version = "0.4", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "webp",
    "bmp",
] }
arboard = { version = "3.6", optional = true }
# rodio 0.19 : les versions 0.20 à 0.23 refondent la sortie (OutputStream,
# Sink, choix du périphérique) sur laquelle reposent la sortie fixe et la
# pause au débranchement ; la montée se fera avec une écoute sur matériel.
rodio = { version = "0.19.0", default-features = false }
crossbeam-channel = "0.5.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
dirs = "7"
anyhow = "1.0"
hound = "3.5"
# L'empreinte de silero_vad.onnx, vérifiée au chargement. La version déjà
# verrouillée par pdf-extract (lopdf) : aucune crate de plus.
sha2 = "0.10.9"
# ureq 2 et pas 3 : le téléchargement des modèles s'appuie sur un délai par
# lecture (`timeout_read`), que ureq 3 remplace par une limite sur tout le
# corps — incompatible avec 342 Mo sur une connexion lente.
ureq = "2.10"
unicode-width = "0.2"
# Langue d'un document (français ou anglais), MIT.
whatlang = "0.18"
# Kokoro au terminal : ONNX Runtime chargé dynamiquement (≥ 1.31, livré à
# côté du binaire par package.sh), MIT/Apache. Épinglé exactement : les
# versions candidates changent d'API (rc.14 : `EnvironmentBuilder::commit`,
# `Session::builder`) ; passer directement à la 2.0 stable.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "ndarray", "std", "api-22"] }
libloading = { version = "0.8", optional = true }
# La dictée au terminal, Apache-2.0. En `shared` : la bibliothèque C de
# sherpa-onnx, liée dynamiquement, utilise l'ONNX Runtime 1.31 livré à côté du
# binaire, le même fichier que Kokoro, au lieu du 1.28.2 qu'elle embarque en
# statique par défaut (lot 1 de la spec des moteurs). Le binaire livré se
# construit avec les --config de scripts/sherpa-onnx.sh, qui remplacent le
# script de build de sherpa-onnx-sys ; sans eux (Clippy, MSRV), ce script
# télécharge sa propre archive, avec ONNX Runtime 1.28.2, que
# examples/ort_single_copy.rs refuse. Épinglé exactement : la bibliothèque C
# vient de la publication de la même version.
sherpa-onnx = { version = "=2.0.2", optional = true, default-features = false, features = ["shared"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MLX en Rust, seulement sur les Mac Apple Silicon. Épinglé exactement :
# `mlx-sys` compile sa propre copie de MLX, dont la version doit rester
# connue (une seule copie dans l'app, voir la spec des moteurs).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "=0.34.0", optional = true }

[build-dependencies]
# Sonic (accélération de la parole) se compile toujours : deux fichiers C.
cc = "1.1"

[features]
# Par défaut le binaire se construit en secondes et se replie sur le TTS système.
default = ["clipboard"]
# Donne accès au presse-papiers : coller du texte ne demande rien de plus.
clipboard = ["dep:arboard"]
# Compile Tesseract dans le binaire pour lire images et scans, presse-papiers
# compris — la reconnaissance s'ajoute au collage, elle ne le conditionne pas.
ocr = ["dep:tesseract-rs", "dep:image", "clipboard"]
# Kokoro au terminal par ONNX Runtime (≥ 1.31, chargé dynamiquement). Jamais
# dans l'app macOS, qui calcule Kokoro en MLX.
kokoro-onnx = ["dep:ort", "dep:libloading"]
# Calcul MLX en Rust (Mac Apple Silicon ; sans effet ailleurs). MLX est
# compilé par CMake au premier build (~4 min, avec accès réseau), puis gardé
# dans target/.
mlx = ["dep:mlx-rs"]
# Dictée par sherpa-onnx, sur le même ONNX Runtime que Kokoro. Jamais dans
# l'app macOS, qui dicte en MLX.
stt-sherpa = ["dep:sherpa-onnx", "kokoro-onnx"]
# Les répertoires de configuration, de données et de cache des essais
# (paths::test_root), pour les crates qui lient dysflow dans leurs essais :
# activée par la dev-dependency de ffi/ seulement, jamais dans un build livré
# (règle R21 : un essai ne touche jamais aux fichiers de l'utilisateur).
test-paths = []

[[bin]]
name = "dysflow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Les macros procédurales et scripts de build ne sont pas livrés : ne pas
# les dépouiller. Avec l'éditeur de liens d'Xcode d'octobre 2026
# (ld-27106), `strip` corrompt leurs dylibs (« mis-aligned LINKEDIT string
# pool »), rustc ne peut plus les charger et rend « can't find crate ».
[profile.release.build-override]
strip = false

# La bibliothèque de l'app macOS : une panique Rust doit rester une erreur
# (rattrapée par UniFFI, verrous repris par `sync`), pas arrêter l'app.
[profile.app]
inherits = "release"
panic = "unwind"

# Le rendu TUI et la synthèse restent fluides même en debug.
[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "kokoro_serve"
required-features = ["kokoro-onnx"]

[[example]]
name = "voice_bench"
required-features = ["mlx"]

[[example]]
name = "kokoro_dictees"
required-features = ["mlx"]

[[example]]
name = "ort_single_copy"
required-features = ["stt-sherpa"]

[[example]]
name = "dictation_bench"
required-features = ["stt-sherpa"]
