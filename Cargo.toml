[workspace]
members = [".", "ffi"]

[package]
name = "sillon"
version = "0.2.0"
edition = "2021"
# Le plus haut `rust-version` des crates que sillon compile (Cargo.lock,
# toutes features : image 0.25.10, darling 0.24…) ; vérifié par la CI (job
# msrv). Le moteur de l'app (ffi/, par uniffi → cargo_metadata →
# cargo-platform 0.3.3) demande 1.91.
rust-version = "1.88"
description = "Lecteur audio TUI en streaming : lit du markdown pipé ou un fichier, le hiérarchise et le lit à voix haute (Kokoro, ou la voix du système)"
license = "MIT"

[dependencies]
ratatui = "0.28.0"
crossterm = "0.28.1"
pulldown-cmark = "0.12.0"
pdf-extract = "0.12.0"
tesseract-rs = { version = "0.4", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "webp",
    "bmp",
] }
arboard = { version = "3.6", optional = true }
rodio = { version = "0.19.0", default-features = false }
crossbeam-channel = "0.5.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
dirs = "5.0"
anyhow = "1.0"
hound = "3.5"
ureq = "2.10"
unicode-width = "0.2"
# Langue d'un document (français ou anglais), MIT.
whatlang = "0.18"
# Kokoro au terminal : ONNX Runtime chargé dynamiquement (≥ 1.31, livré à
# côté du binaire par package.sh), MIT/Apache.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "ndarray", "std", "api-22"] }
libloading = { version = "0.8", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Sonic (accélération de la parole) se compile toujours : deux fichiers C.
cc = "1.1"

[features]
# Par défaut le binaire se construit en secondes et se replie sur le TTS système.
default = ["clipboard"]
# Donne accès au presse-papiers : coller du texte ne demande rien de plus.
clipboard = ["dep:arboard"]
# Compile Tesseract dans le binaire pour lire images et scans, presse-papiers
# compris — la reconnaissance s'ajoute au collage, elle ne le conditionne pas.
ocr = ["dep:tesseract-rs", "dep:image", "clipboard"]
# Kokoro au terminal par ONNX Runtime (≥ 1.31, chargé dynamiquement). Jamais
# dans l'app macOS, qui calcule Kokoro en MLX.
kokoro-onnx = ["dep:ort", "dep:libloading"]

[[bin]]
name = "sillon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Le rendu TUI et la synthèse restent fluides même en debug.
[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "kokoro_serve"
required-features = ["kokoro-onnx"]
